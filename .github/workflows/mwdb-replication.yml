name: MW-DB Replication

on:
  push:
    paths:
      - 'mwdb/replication/**'
      - 'mwdb/auth/**'
      - 'mwdb/canonical/**'
      - 'mwdb/cursor/**'
      - 'mwdb/identity/**'
      - 'mwdb/local-first/**'
      - 'mwdb/merkle/**'
      - 'mwdb/observability/**'
      - 'mwdb/sync/**'
      - '.github/workflows/mwdb-replication.yml'
  pull_request:
    paths:
      - 'mwdb/replication/**'
      - 'mwdb/auth/**'
      - 'mwdb/canonical/**'
      - 'mwdb/cursor/**'
      - 'mwdb/identity/**'
      - 'mwdb/local-first/**'
      - 'mwdb/merkle/**'
      - 'mwdb/observability/**'
      - 'mwdb/sync/**'
      - '.github/workflows/mwdb-replication.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test MW-DB replication
        working-directory: mwdb/replication
        run: cargo test --all-targets
